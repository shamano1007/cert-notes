<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="資格試験の学習ノート（用語集）。全 130 用語を検索できます。">
<meta property="og:type" content="website">
<meta property="og:title" content="学習ノート">
<meta property="og:description" content="資格試験の学習ノート（用語集）。全 130 用語を検索できます。">
<title>学習ノート</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128216;</text></svg>">
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --bg-card: #ffffff;
  --fg: #1a1d21;
  --fg-muted: #5b6472;
  --line: #e2e6ec;
  --accent: #1a73e8;
  --accent-soft: #e8f0fe;
  --warn-bg: #fff4e5;
  --warn-line: #f0a63c;
  --warn-fg: #7a4a06;
  --note-bg: #f2f4f7;
  --note-fg: #4a5361;
  --mark: #ffe680;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  --header-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216;
    --bg-soft: #161a20;
    --bg-card: #171c22;
    --fg: #e6e9ee;
    --fg-muted: #9aa4b2;
    --line: #262d36;
    --accent: #7cb0ff;
    --accent-soft: #1b2836;
    --warn-bg: #2e2311;
    --warn-line: #b9822f;
    --warn-fg: #f0c489;
    --note-bg: #1b2028;
    --note-fg: #aab3c0;
    --mark: #6b5a12;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --bg-soft: #161a20; --bg-card: #171c22;
  --fg: #e6e9ee; --fg-muted: #9aa4b2; --line: #262d36;
  --accent: #7cb0ff; --accent-soft: #1b2836;
  --warn-bg: #2e2311; --warn-line: #b9822f; --warn-fg: #f0c489;
  --note-bg: #1b2028; --note-fg: #aab3c0; --mark: #6b5a12;
  --shadow: none;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
               "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.85;
  -webkit-text-size-adjust: 100%;
  overflow-wrap: anywhere;
}
.iconbtn {
  flex: none;
  width: 38px; height: 38px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg-card); color: var(--fg);
  font-size: 17px; cursor: pointer; padding: 0;
  text-decoration: none;
}
.iconbtn:active { transform: scale(.95); }

.page { max-width: 780px; margin: 0 auto; padding: 40px 20px 90px; }
.topbar { display: flex; justify-content: flex-end; margin-bottom: 26px; }
h1 { font-size: 26px; line-height: 1.4; margin: 0 0 10px; letter-spacing: -.01em; }
@media (min-width: 700px) { h1 { font-size: 32px; } }
.tagline { color: var(--fg-muted); font-size: 15px; margin: 0 0 8px; }
.totals { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-muted); }
.totals span {
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 11px;
}
.list { margin-top: 34px; display: grid; gap: 14px; }
.card {
  display: block; text-decoration: none; color: inherit;
  padding: 20px 20px 17px;
  background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow);
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.45; }
.card p { margin: 0 0 12px; font-size: 14px; color: var(--fg-muted); line-height: 1.7; }
.card .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-muted); }
.card .meta span {
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 10px;
}
footer {
  margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--fg-muted);
}
footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="iconbtn" id="themeBtn" aria-label="配色を切り替え">&#9686;</button>
  </div>

  <h1>学習ノート</h1>
  <p class="tagline">資格試験の勉強用にまとめた用語集です。各ページは用語名と本文の全文検索に対応しています。</p>
  <div class="totals"><span>1 教材</span><span>全 130 用語</span></div>

  <div class="list">
<a class="card" href="genai-leader.html"><h2>Google Cloud Generative AI Leader 用語集</h2><p>学習しやすいよう、基礎 → 生成AI → 使いこなし → 製品 → 戦略 の順に並べています。</p><div class="meta"><span>全 130 用語</span><span>11 章</span></div></a>
  </div>

  <footer>
    内容の正確性は保証しません。試験対策としてご利用の際は、必ず公式の試験ガイドをあわせて確認してください。
  </footer>
</div>
<script>
(function () {
  var root = document.documentElement;
  var KEY = "study-notes-theme";
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) root.setAttribute("data-theme", saved);
  } catch (e) {}
  var btn = document.getElementById("themeBtn");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var dark = root.getAttribute("data-theme")
      ? root.getAttribute("data-theme") === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });
})();
</script>
</body>
</html>
